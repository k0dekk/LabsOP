<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Lab 1 — Generators & Timeout Iterator</title>
</head>
<body>
  <h1>Lab 1: Generators and Iterators</h1>
  <p>
    <button onclick="runDemo()">Fibonacci (1 sec)</button>
    <button onclick="clearOutput()">Clear</button>
  </p>
  <pre id="output"></pre>

  <script src="demo.js"></script>
  <script>
    const output = document.getElementById("output");

    function append(text) {
      output.textContent += text + "\n";
    }

    function clearOutput() {
      output.textContent = "";
    }

    function runDemo() {
      append("=== Fibonacci ===");
      runWithTimeout(fibonacciGenerator(), 1, null, append);
    }
  </script>
</body>
