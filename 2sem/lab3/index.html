<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Lab 3 — Memoization</title>
</head>
<body>
  <h1>Lab 3: Memoization (кеш, eviction, stats)</h1>
  <p>
    <label>Eviction: </label>
    <select id="evictionSelect">
      <option value="LRU">LRU</option>
      <option value="LFU">LFU</option>
      <option value="TIME_BASED">TIME_BASED</option>
    </select>
    <label>maxSize: </label>
    <input id="maxSize" type="number" value="5" min="1">
    <button onclick="initMemo()">Apply</button>
  </p>
  <p>
    <button onclick="callMemo()">fib(n)</button>
    <input id="fibN" type="number" value="10" min="0">
    <button onclick="refreshCacheDisplay()">Refresh cache</button>
    <button onclick="clearMemo()">Clear cache</button>
  </p>

  <h3>Cache contents</h3>
  <pre id="cacheOutput"></pre>

  <h3>Stats</h3>
  <pre id="statsOutput"></pre>

  <script src="demo.js"></script>
  <script>
    const cacheOutput = document.getElementById("cacheOutput");
    const statsOutput = document.getElementById("statsOutput");

    let memoizedFib;
    let lastCall = "";

    function initMemo() {
      const eviction = document.getElementById("evictionSelect").value;
      const maxSize = parseInt(document.getElementById("maxSize").value, 10);
      memoizedFib = memoize(
        function fib(n) {
          if (n <= 1) return n;
          return memoizedFib(n - 1) + memoizedFib(n - 2);
        },
        { maxSize, eviction, maxAgeMs: eviction === "TIME_BASED" ? 5000 : 60000 }
      );
      refreshCacheDisplay();
    }

    function callMemo() {
      if (!memoizedFib) initMemo();
      const n = parseInt(document.getElementById("fibN").value, 10);
      const start = performance.now();
      const result = memoizedFib(n);
      lastCall = "fib(" + n + ") = " + result + " (" + (performance.now() - start).toFixed(2) + " ms)";
      refreshCacheDisplay();
    }

    function refreshCacheDisplay() {
      if (!memoizedFib) return;
      const info = memoizedFib.getCacheInfo();
      cacheOutput.textContent = "Entries (" + info.size + "/" + info.maxSize + "), eviction: " + info.eviction + "\n";
      info.entries.forEach((e) => {
        cacheOutput.textContent += "  " + e.key + " => " + e.value + " | accesses: " + e.accessCount + " | lastAccess: " + e.lastAccess + "\n";
      });
      if (info.evictedLog.length) {
        cacheOutput.textContent += "\nEvicted:\n";
        info.evictedLog.slice(-10).forEach((e) => {
          cacheOutput.textContent += "  " + e.key + " (" + e.reason + ")\n";
        });
      }
      statsOutput.textContent = (lastCall ? lastCall + "\n" : "") + "hits: " + info.hits + ", misses: " + info.misses;
    }

    function clearMemo() {
      if (!memoizedFib) return;
      memoizedFib.clearCache();
      cacheOutput.textContent = "";
      statsOutput.textContent = "";
    }

    initMemo();
  </script>
</body>
</html>
